name: WF4 Kosodate Quote (ise_sato_kosodate, daily 7-8am random)

on:
  schedule:
    # GitHubの定期実行は数時間遅れることがある(2026-10-22は6:20予定が9:02開始)ため、早めに2回予約する。
    # 動画を作ったあと日本時間7:00〜8:00のランダムな時刻まで待って投稿する。2回目は投稿済みならスキップ(同時には動かない)
    - cron: "30 19 * * *" # JST 4:30
    - cron: "30 20 * * *" # JST 5:30
  workflow_dispatch:
    inputs:
      no_upload:
        description: "trueなら投稿せず動画だけ生成してartifactに残す(動作確認用)"
        required: false
        default: "false"
      force:
        description: "trueなら間隔判定を無視して強制実行"
        required: false
        default: "false"

permissions:
  contents: write

concurrency:
  group: wf4-kosodate-quote
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install ffmpeg and Japanese fonts
        run: sudo apt-get update && sudo apt-get install -y ffmpeg fonts-noto-cjk
      - name: VOICEVOXエンジンをキャッシュ
        id: cache-voicevox
        uses: actions/cache@v4
        with:
          path: scripts/daily-pipeline/voicevox_engine
          key: voicevox-engine-linux-cpu-x64-0.25.2
      - name: VOICEVOXエンジン取得
        if: steps.cache-voicevox.outputs.cache-hit != 'true'
        run: |
          mkdir -p scripts/daily-pipeline/voicevox_engine
          cd scripts/daily-pipeline/voicevox_engine
          curl -sL -o engine.7z https://github.com/VOICEVOX/voicevox_engine/releases/download/0.25.2/voicevox_engine-linux-cpu-x64-0.25.2.7z.001
          sudo apt-get install -y p7zip-full
          7z x engine.7z
          chmod +x linux-cpu-x64/run || chmod +x run || true
      - name: Install Remotion dependencies
        working-directory: remotion
        run: npm install
      - name: Ensure Remotion's headless Chromium is installed
        working-directory: remotion
        run: npx remotion browser ensure
      - name: Generate and post reel
        env:
          WF4_DRYRUN: ${{ github.event.inputs.no_upload == 'true' && '1' || '' }}
          WF4_FORCE: ${{ github.event.inputs.force == 'true' && '1' || '' }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ENGINE_DIR: ${{ github.workspace }}/scripts/daily-pipeline/voicevox_engine
          IG_TOKEN_ISE_SATO_KOSODATE: ${{ secrets.IG_TOKEN_ISE_SATO_KOSODATE }}
        run: node scripts/generate-clip-quote.js ise_sato_kosodate
      - name: 動画をartifactに保存(動作確認用)
        if: ${{ github.event.inputs.no_upload == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: kosodate-quote-preview
          path: |
            wf4_preview/ise_sato_kosodate/**/video.mp4
            wf4_preview/ise_sato_kosodate/**/script.json
            wf4_preview/ise_sato_kosodate/**/caption.txt
            wf4_preview/ise_sato_kosodate/**/cover.jpg
