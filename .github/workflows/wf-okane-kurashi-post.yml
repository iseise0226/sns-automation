name: WF くらしの確認帳リール投稿(oshiete.okane・手元で作った動画)

# 動画は手元のPC（Claudeの毎日タスク）が作り、URLを渡してこのワークフローを起動する
on:
  workflow_dispatch:
    inputs:
      video_url:
        description: "リール動画のURL（mp4）"
        required: false
        default: ""
      cover_url:
        description: "表紙画像のURL（jpg）"
        required: false
        default: ""
      caption:
        description: "キャプション（ハッシュタグ込み）"
        required: false
        default: ""
      dry_run:
        description: "trueなら鍵の確認だけで投稿しない"
        required: false
        default: "false"

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: scripts/post_okane_kurashi.js
          sparse-checkout-cone-mode: false
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: リールを投稿
        env:
          IG_TOKEN_OKANE_TAIDAN: ${{ secrets.IG_TOKEN_OKANE_TAIDAN }}
          CAPTION: ${{ github.event.inputs.caption }}
          VIDEO_URL: ${{ github.event.inputs.video_url }}
          COVER_URL: ${{ github.event.inputs.cover_url }}
        run: |
          printf '%s' "$CAPTION" > caption.txt
          FLAG=""
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then FLAG="--dry"; fi
          node scripts/post_okane_kurashi.js "$VIDEO_URL" "$COVER_URL" caption.txt $FLAG
