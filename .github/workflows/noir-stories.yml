name: NOIR Stories - seira_noir_ai

on:
  schedule:
    # Check every 15 minutes from 09:07 through 21:52 JST, away from the
    # heavily loaded :00/:30 boundaries. The script posts overdue slots.
    - cron: '7,22,37,52 0-12 * * *'
  workflow_dispatch:
    inputs:
      dryrun:
        description: 'true = render only; false = publish a Story'
        required: true
        default: 'true'
        type: choice
        options: ['true', 'false']
      slot:
        description: 'Caption type for manual runs'
        required: true
        default: 'night'
        type: choice
        options: ['morning', 'afternoon', 'night']

permissions:
  contents: read
  id-token: write

concurrency:
  group: noir-stories-seira-noir-ai
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install video tools
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg fonts-noto-cjk
      - id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/956015506197/locations/global/workloadIdentityPools/github-actions-noir/providers/github-actions
          service_account: noir-story-drive-readernoir-st@sns-automation-501912.iam.gserviceaccount.com
          token_format: access_token
          access_token_scopes: https://www.googleapis.com/auth/drive.readonly
      - name: Render and publish
        env:
          GDRIVE_TOKEN: ${{ steps.auth.outputs.access_token }}
          IG_TOKEN_SEIRA_NOIR_AI: ${{ secrets.IG_TOKEN_SEIRA_NOIR_AI }}
          NOIR_DRYRUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dryrun == 'true' && '1' || '0' }}
          NOIR_SLOT: ${{ github.event_name == 'workflow_dispatch' && inputs.slot || '' }}
          NOIR_STORY_SCHEDULED: ${{ github.event_name == 'schedule' && '1' || '0' }}
        run: node scripts/noir-story.js
      - name: Save rendered preview for dry runs
        if: github.event_name == 'workflow_dispatch' && inputs.dryrun == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: noir-story-preview
          path: noir_story_output/story.mp4
          if-no-files-found: error
