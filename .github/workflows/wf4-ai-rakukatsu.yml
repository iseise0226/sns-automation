name: WF4 AIラク活 chat reel (sessi_life, daily)

# 旧sessi_lifeを「AIラク活」に作り直したアカウント用(2026-10-30〜)。
# 台本 → コピペ用の文を実際にAIへ送って答えを取る → VOICEVOXの声 → Remotion(ChatReel) → 投稿。
on:
  schedule:
    # JST 20:00 = UTC 11:00。仕事・家事が終わってスマホを見る時間に合わせる
    - cron: "0 11 * * *"
  workflow_dispatch:
    inputs:
      dryrun:
        description: "trueなら投稿せず、動画をArtifactに残すだけ"
        required: false
        default: "true"
      force:
        description: "trueなら前回からの間隔を無視して実行"
        required: false

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install ffmpeg and Japanese fonts
        run: sudo apt-get update && sudo apt-get install -y ffmpeg fonts-noto-cjk
      - name: Cache VOICEVOX engine
        id: cache-voicevox
        uses: actions/cache@v4
        with:
          path: scripts/daily-pipeline/voicevox_engine
          key: voicevox-engine-linux-cpu-x64-0.25.2
      - name: Download VOICEVOX engine
        if: steps.cache-voicevox.outputs.cache-hit != 'true'
        run: |
          mkdir -p scripts/daily-pipeline/voicevox_engine
          cd scripts/daily-pipeline/voicevox_engine
          curl -sL -o engine.7z https://github.com/VOICEVOX/voicevox_engine/releases/download/0.25.2/voicevox_engine-linux-cpu-x64-0.25.2.7z.001
          sudo apt-get install -y p7zip-full
          7z x engine.7z
          chmod +x linux-cpu-x64/run || chmod +x run || true
      - name: Install Remotion dependencies
        working-directory: remotion
        run: npm install
      - name: Ensure Remotion's headless Chromium is installed
        working-directory: remotion
        run: npx remotion browser ensure
      - name: Generate and post chat reel
        env:
          WF4_DRYRUN: ${{ github.event.inputs.dryrun == 'true' && '1' || '' }}
          WF4_FORCE: ${{ github.event.inputs.force }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ENGINE_DIR: ${{ github.workspace }}/scripts/daily-pipeline/voicevox_engine
          IG_TOKEN_SESSI_LIFE: ${{ secrets.IG_TOKEN_SESSI_LIFE }}
        run: node scripts/generate-chat-reel.js sessi_life
      - name: Keep the video
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chat-reel
          path: |
            wf4_preview/**/video.mp4
            wf4_preview/**/caption.txt
            wf4_preview/**/script.json
            wf4_preview/**/cover.jpg
            wf4_media/**/video.mp4
            wf4_media/**/caption.txt
            wf4_media/**/script.json
            wf4_media/**/cover.jpg
          if-no-files-found: ignore
