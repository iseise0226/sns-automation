name: WF4 Reels (6 accounts, daily)

on:
  schedule:
    # JST 4:40 = UTC 19:40(前日)。毎日6アカウント全部実行(2026-07-26に毎日化)
    - cron: "40 19 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "trueなら間隔判定を無視して強制実行"
        required: false
      account:
        description: "指定した1アカウントだけ実行（例: tabi_life_design）"
        required: false

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install ffmpeg and Japanese fonts
        run: sudo apt-get update && sudo apt-get install -y ffmpeg fonts-noto-cjk
      - name: VOICEVOXエンジンをキャッシュ
        id: cache-voicevox
        uses: actions/cache@v4
        with:
          path: scripts/daily-pipeline/voicevox_engine
          key: voicevox-engine-linux-cpu-x64-0.25.2
      - name: VOICEVOXエンジン取得
        if: steps.cache-voicevox.outputs.cache-hit != 'true'
        run: |
          mkdir -p scripts/daily-pipeline/voicevox_engine
          cd scripts/daily-pipeline/voicevox_engine
          curl -sL -o engine.7z https://github.com/VOICEVOX/voicevox_engine/releases/download/0.25.2/voicevox_engine-linux-cpu-x64-0.25.2.7z.001
          sudo apt-get install -y p7zip-full
          7z x engine.7z
          chmod +x linux-cpu-x64/run || chmod +x run || true
      - name: Install Remotion dependencies
        working-directory: remotion
        run: npm install
      - name: Ensure Remotion's headless Chromium is installed
        working-directory: remotion
        run: npx remotion browser ensure
      - name: Generate and post reels
        env:
          WF4_FORCE: ${{ github.event.inputs.force }}
          WF4_ONLY: ${{ github.event.inputs.account }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ENGINE_DIR: ${{ github.workspace }}/scripts/daily-pipeline/voicevox_engine
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          IG_TOKEN_SATOSHI_MINDSET: ${{ secrets.IG_TOKEN_SATOSHI_MINDSET }}
          IG_TOKEN_SATOSHI_MIND_COACHING: ${{ secrets.IG_TOKEN_SATOSHI_MIND_COACHING }}
          IG_TOKEN_ISE_SATO_KOSODATE: ${{ secrets.IG_TOKEN_ISE_SATO_KOSODATE }}
          IG_TOKEN_SESSI_LIFE: ${{ secrets.IG_TOKEN_SESSI_LIFE }}
          IG_TOKEN_ISE_KENKOU_OTAKU: ${{ secrets.IG_TOKEN_ISE_KENKOU_OTAKU }}
          IG_TOKEN_TABI_LIFE_DESIGN: ${{ secrets.IG_TOKEN_TABI_LIFE_DESIGN }}
        run: node scripts/run-wf4.js
