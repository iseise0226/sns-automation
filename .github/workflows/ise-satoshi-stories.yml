name: ise_satoshi Stories
on:
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * *'
    - cron: '0 6 * * *'
    - cron: '0 12 * * *'
permissions:
  contents: read
jobs:
  story:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install video tools`n        run: sudo apt-get update && sudo apt-get install -y ffmpeg fonts-noto-cjk`n      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: node scripts/ise-satoshi/generate-ise-satoshi-story.js
      - run: node scripts/ise-satoshi/publish-ise-satoshi-story.js
        env:
          IG_TOKEN_ISE_SATOSHI: ${{ secrets.IG_TOKEN_ISE_SATOSHI }}
          IG_USER_ID: '17841401793428016'


