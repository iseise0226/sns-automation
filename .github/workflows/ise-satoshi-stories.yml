name: ise_satoshi Stories
on:
  workflow_dispatch:
    inputs:
      slot:
        description: '0 or 1 = own video, 2 = test of daily slot; source rotates by date'
        type: choice
        options: ['0', '1', '2']
        default: '0'
      dry_run:
        description: 'Generate video without publishing'
        type: boolean
        default: false
  schedule:
    - cron: '*/15 0-11 * * *'
permissions:
  contents: read
jobs:
  story:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Plan today's random posting times
        id: plan
        run: node scripts/ise-satoshi/plan-ise-satoshi-story.js
        env:
          MANUAL_SLOT: ${{ inputs.slot }}
      - name: Check whether this scheduled slot is already posted
        id: posted
        if: github.event_name == 'schedule' && steps.plan.outputs.should_post == 'true'
        uses: actions/cache/restore@v4
        with:
          path: .story-published
          key: ise-satoshi-story-${{ steps.plan.outputs.date }}-${{ steps.plan.outputs.slot }}
          lookup-only: true
      - name: Install video tools
        if: steps.plan.outputs.should_post == 'true' && (github.event_name == 'workflow_dispatch' || steps.posted.outputs.cache-hit != 'true')
        run: sudo apt-get update && sudo apt-get install -y ffmpeg fonts-noto-cjk
      - uses: actions/setup-node@v4
        if: steps.plan.outputs.should_post == 'true' && (github.event_name == 'workflow_dispatch' || steps.posted.outputs.cache-hit != 'true')
        with:
          node-version: '20'
      - if: steps.plan.outputs.should_post == 'true' && (github.event_name == 'workflow_dispatch' || steps.posted.outputs.cache-hit != 'true')
        run: node scripts/ise-satoshi/generate-ise-satoshi-story.js
        env:
          STORY_SLOT: ${{ steps.plan.outputs.slot }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
      - if: steps.plan.outputs.should_post == 'true' && inputs.dry_run != true && (github.event_name == 'workflow_dispatch' || steps.posted.outputs.cache-hit != 'true')
        run: node scripts/ise-satoshi/publish-ise-satoshi-story.js
        env:
          IG_TOKEN_ISE_SATOSHI: ${{ secrets.IG_TOKEN_ISE_SATOSHI }}
          IG_USER_ID: '17841401793428016'
      - name: Record successful scheduled post
        if: github.event_name == 'schedule' && steps.plan.outputs.should_post == 'true' && steps.posted.outputs.cache-hit != 'true'
        run: |
          mkdir -p .story-published
          echo "${{ steps.plan.outputs.date }}-${{ steps.plan.outputs.slot }}" > .story-published/post.txt
      - name: Save scheduled post record
        if: github.event_name == 'schedule' && steps.plan.outputs.should_post == 'true' && steps.posted.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: .story-published
          key: ise-satoshi-story-${{ steps.plan.outputs.date }}-${{ steps.plan.outputs.slot }}
